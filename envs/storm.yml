name: storm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Scientific / meteorology stack
  - metpy=1.7.1
  - scipy=1.17.1
  - numpy=2.4.2
  - matplotlib-base=3.10.8
  - pandas=3.0.1
  - xarray=2026.2.0
  - cartopy=0.25.0
  - pyproj=3.7.2
  - shapely=2.1.2
  - pillow=12.1.1
  - h5py
  - h5netcdf
  # NOXP Sigmet/IRIS and CF/Radial moment readers. xradar 0.11 matches pinned xarray.
  - netcdf4=1.7.2
  - arm_pyart=2.1.1
  - xradar=0.11.1
  # Networking
  - paho-mqtt=2.1.0
  - requests=2.32.5
  - boto3=1.42.59
  # Utilities
  - openpyxl=3.1.5       # storm tracks saved/loaded as Excel (.xlsx)
  - pyserial
  - pynmea2
  - git
  - pip
  - pip:
      - pyqt6==6.10.2
      - pyqt6-qt6==6.10.2
      - pyqt6-sip==13.11.0
      - pyqt6-webengine==6.10.0
      - pyqt6-webengine-qt6==6.10.2
